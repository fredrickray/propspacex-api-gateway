syntax = "proto3";

package property;

service PropertyService {
  // Property CRUD
  rpc CreateProperty(CreatePropertyRequest) returns (PropertyResponse);
  rpc GetProperty(GetPropertyRequest) returns (PropertyResponse);
  rpc UpdateProperty(UpdatePropertyRequest) returns (PropertyResponse);
  rpc DeleteProperty(DeletePropertyRequest) returns (MessageResponse);
  
  // Property Listings
  rpc GetProperties(GetPropertiesRequest) returns (PropertiesResponse);
  rpc GetPropertiesByOwner(GetPropertiesByOwnerRequest) returns (PropertiesResponse);
  rpc SearchProperties(SearchPropertiesRequest) returns (PropertiesResponse);
  rpc GetFeaturedProperties(GetFeaturedPropertiesRequest) returns (PropertiesResponse);
  
  // Property Status
  rpc UpdatePropertyStatus(UpdatePropertyStatusRequest) returns (PropertyResponse);
  rpc MarkAsSold(MarkAsSoldRequest) returns (PropertyResponse);
  rpc MarkAsRented(MarkAsRentedRequest) returns (PropertyResponse);
  
  // Property Media
  rpc AddPropertyImages(AddPropertyImagesRequest) returns (PropertyResponse);
  rpc RemovePropertyImage(RemovePropertyImageRequest) returns (PropertyResponse);
  
  // Favorites
  rpc AddToFavorites(FavoriteRequest) returns (MessageResponse);
  rpc RemoveFromFavorites(FavoriteRequest) returns (MessageResponse);
  rpc GetUserFavorites(GetUserFavoritesRequest) returns (PropertiesResponse);
  
  // Reviews
  rpc AddPropertyReview(AddReviewRequest) returns (ReviewResponse);
  rpc GetPropertyReviews(GetPropertyReviewsRequest) returns (ReviewsResponse);
}

// Common Messages
message MessageResponse {
  string message = 1;
  bool success = 2;
}

// Property Messages
message Property {
  string id = 1;
  string title = 2;
  string description = 3;
  string type = 4; // "apartment", "house", "land", "commercial"
  string listingType = 5; // "sale", "rent", "shortlet"
  double price = 6;
  string currency = 7;
  Address address = 8;
  PropertyFeatures features = 9;
  repeated string images = 10;
  string ownerId = 11;
  string ownerName = 12;
  string status = 13; // "available", "sold", "rented", "pending"
  bool isFeatured = 14;
  bool isVerified = 15;
  double rating = 16;
  int32 reviewCount = 17;
  string createdAt = 18;
  string updatedAt = 19;
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string country = 4;
  string zipCode = 5;
  double latitude = 6;
  double longitude = 7;
}

message PropertyFeatures {
  int32 bedrooms = 1;
  int32 bathrooms = 2;
  int32 toilets = 3;
  double area = 4; // in square meters
  string areaUnit = 5;
  int32 parkingSpaces = 6;
  bool furnished = 7;
  bool serviced = 8;
  bool newlyBuilt = 9;
  repeated string amenities = 10;
}

// Create Property
message CreatePropertyRequest {
  string title = 1;
  string description = 2;
  string type = 3;
  string listingType = 4;
  double price = 5;
  string currency = 6;
  Address address = 7;
  PropertyFeatures features = 8;
  repeated string images = 9;
  string ownerId = 10;
}

message PropertyResponse {
  bool success = 1;
  string message = 2;
  Property property = 3;
}

// Get Property
message GetPropertyRequest {
  string propertyId = 1;
}

// Update Property
message UpdatePropertyRequest {
  string propertyId = 1;
  string title = 2;
  string description = 3;
  string type = 4;
  string listingType = 5;
  double price = 6;
  string currency = 7;
  Address address = 8;
  PropertyFeatures features = 9;
}

// Delete Property
message DeletePropertyRequest {
  string propertyId = 1;
  string ownerId = 2;
}

// Get Properties
message GetPropertiesRequest {
  int32 page = 1;
  int32 limit = 2;
  string type = 3;
  string listingType = 4;
  string status = 5;
  string city = 6;
  string state = 7;
}

message PropertiesResponse {
  bool success = 1;
  repeated Property properties = 2;
  int32 total = 3;
  int32 page = 4;
  int32 totalPages = 5;
}

// Get Properties by Owner
message GetPropertiesByOwnerRequest {
  string ownerId = 1;
  int32 page = 2;
  int32 limit = 3;
}

// Search Properties
message SearchPropertiesRequest {
  string query = 1;
  string type = 2;
  string listingType = 3;
  double minPrice = 4;
  double maxPrice = 5;
  int32 minBedrooms = 6;
  int32 maxBedrooms = 7;
  string city = 8;
  string state = 9;
  int32 page = 10;
  int32 limit = 11;
}

// Featured Properties
message GetFeaturedPropertiesRequest {
  int32 limit = 1;
}

// Property Status
message UpdatePropertyStatusRequest {
  string propertyId = 1;
  string status = 2;
}

message MarkAsSoldRequest {
  string propertyId = 1;
}

message MarkAsRentedRequest {
  string propertyId = 1;
}

// Property Images
message AddPropertyImagesRequest {
  string propertyId = 1;
  repeated string images = 2;
}

message RemovePropertyImageRequest {
  string propertyId = 1;
  string imageUrl = 2;
}

// Favorites
message FavoriteRequest {
  string userId = 1;
  string propertyId = 2;
}

message GetUserFavoritesRequest {
  string userId = 1;
  int32 page = 2;
  int32 limit = 3;
}

// Reviews
message Review {
  string id = 1;
  string propertyId = 2;
  string userId = 3;
  string userName = 4;
  string userAvatar = 5;
  int32 rating = 6;
  string comment = 7;
  string createdAt = 8;
}

message AddReviewRequest {
  string propertyId = 1;
  string userId = 2;
  int32 rating = 3;
  string comment = 4;
}

message ReviewResponse {
  bool success = 1;
  string message = 2;
  Review review = 3;
}

message GetPropertyReviewsRequest {
  string propertyId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ReviewsResponse {
  bool success = 1;
  repeated Review reviews = 2;
  int32 total = 3;
  int32 page = 4;
  int32 totalPages = 5;
}
