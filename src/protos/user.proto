syntax = "proto3";

import "google/protobuf/timestamp.proto";

package user;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetUserEmail (GetUserEmailRequest) returns (GetUserResponse);
  rpc Signin (SigninRequest) returns (SignInResponse);
  rpc Signup (SignupRequest) returns (SignupResponse);
  rpc VerifyOTP (VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc ResendOTP (ResendOTPRequest) returns (ResendOTPResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ListVerifications (ListVerificationsRequest) returns (ListVerificationsResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc RequestWeb3Nonce (RequestWeb3NonceRequest) returns (RequestWeb3NonceResponse);
  rpc VerifyWeb3Signature (VerifyWeb3SignatureRequest) returns (VerifyWeb3SignatureResponse);
  rpc LinkWeb3Wallet (LinkWeb3WalletRequest) returns (LinkWeb3WalletResponse);
  rpc UnlinkWeb3Wallet (UnlinkWeb3WalletRequest) returns (UnlinkWeb3WalletResponse);


  // Security & Device Management (called by API Gateway)
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RegisterDevice (RegisterDeviceRequest) returns (RegisterDeviceResponse);
  rpc LogActivity (LogActivityRequest) returns (LogActivityResponse);
  rpc CheckDeviceTrust (CheckDeviceTrustRequest) returns (CheckDeviceTrustResponse);

  // Buyer-Agent Chat (called by API Gateway)
  rpc CreateOrGetConversation (CreateOrGetConversationRequest) returns (CreateOrGetConversationResponse);
  rpc SendChatMessage (SendChatMessageRequest) returns (SendChatMessageResponse);
  rpc ListConversations (ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListConversationMessages (ListConversationMessagesRequest) returns (ListConversationMessagesResponse);
  rpc MarkConversationRead (MarkConversationReadRequest) returns (MarkConversationReadResponse);
  rpc CreateOrGetDeal (CreateOrGetDealRequest) returns (DealResponse);
  rpc ListDeals (ListDealsRequest) returns (ListDealsResponse);
  rpc GetDeal (GetDealRequest) returns (DealResponse);
  rpc QuoteDeal (QuoteDealRequest) returns (DealResponse);
  rpc AcceptDealQuote (AcceptDealQuoteRequest) returns (DealResponse);
  rpc GetAgentDealStats (GetAgentDealStatsRequest) returns (GetAgentDealStatsResponse);
}


message CreateUserRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string password = 4;
  string phone = 5;
}

message SigninRequest {
  string email = 1;
  string password = 2;
}

message SignInResponse {
  bool success = 1;
  GetUserResponse user = 2;
  string error = 3;
  string accessToken = 4;
  string refreshToken = 5;
}

message CreateUserResponse {
  bool success = 1;
  string userId = 2;
}

message RefreshTokenRequest {
  string refreshToken = 1;
}
message RefreshTokenResponse {
  bool success = 1;
  string accessToken = 2;
  string refreshToken = 3;
  string error = 4;
}

message RequestWeb3NonceRequest {
  string walletAddress = 1;
  string appRole = 2;
}

message RequestWeb3NonceResponse {
  bool success = 1;
  string nonce = 2;
  string message = 3;
  string error = 4;
}

message VerifyWeb3SignatureRequest {
  string walletAddress = 1;
  string signature = 2;
  string message = 3;
}

message VerifyWeb3SignatureResponse {
  bool success = 1;
  GetUserResponse user = 2;
  string error = 3;
  string accessToken = 4;
  string refreshToken = 5;
}

message LinkWeb3WalletRequest {
  string userId = 1;
  string walletAddress = 2;
}

message LinkWeb3WalletResponse {
  bool success = 1;
  string message = 2;
  bool isPrimary = 3;
  string error = 4;
}

message UnlinkWeb3WalletRequest {
  string userId = 1;
  string walletAddress = 2;
}

message UnlinkWeb3WalletResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}

message GetUserRequest {
  string userId = 1;
}

message GetUserEmailRequest {
  string email = 1;
}

message GetUserResponse {
  string userId = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
  bool isVerified = 6;
  bool isAccountActive = 7;
  google.protobuf.Timestamp lastLoginDate = 8;
  int32 loginAttempts = 9;
  int32 allowedLoginAttempts = 10;
  int32 loginCooldown = 11;
  string createdAt = 12;
  string updatedAt = 13;
  string appRole = 14;
}

message ListUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string search = 3;
}

message ListUsersResponse {
  repeated GetUserResponse users = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message UpdateUserRequest {
  string userId = 1;
  string firstName = 2;
  string lastName = 3;
  string email = 4;
  string phone = 5;
}

message UpdateUserResponse {
  bool success = 1;
}

message DeleteUserRequest {
  string userId = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

// Signup messages
message SignupRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string password = 4;
  string appRole = 5;
}

message SignupResponse {
  bool success = 1;
  string userId = 2;
  string message = 3;
  string error = 4;
}

// OTP Verification messages
message VerifyOTPRequest {
  string email = 1;
  string otp = 2;
}

message VerifyOTPResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}

// Resend OTP messages
message ResendOTPRequest {
  string email = 1;
}

message ResendOTPResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}

message ResetPasswordRequest {
  string token = 1;
  string password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
}


// Security & Device Management messages
message ValidateTokenRequest {
  string accessToken = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string userId = 2;
  string email = 3;
  string appRole = 4;
  bool isVerified = 5;
  bool isAccountActive = 6;
  string error = 7;
}

// Device Registration
message RegisterDeviceRequest {
  string userId = 1;
  string ipAddress = 2;
  string userAgent = 3;
  bool isTrusted = 4;
}

message RegisterDeviceResponse {
  bool success = 1;
  string deviceId = 2;
  bool isNewDevice = 3;
  bool isSuspicious = 4;
}

// Activity Logging
message LogActivityRequest {
  string event = 1;
  string userId = 2;
  string ipAddress = 3;
  string userAgent = 4;
  string deviceId = 5;
  string metadata = 6; // JSON string
}

message LogActivityResponse {
  bool success = 1;
}

// Device Trust Check
message CheckDeviceTrustRequest {
  string userId = 1;
  string deviceId = 2;
}

message CheckDeviceTrustResponse {
  bool isTrusted = 1;
}

// Chat messages
message CreateOrGetConversationRequest {
  string buyerId = 1;
  string agentId = 2;
  string propertyId = 3;
}

message ConversationResponse {
  string conversationId = 1;
  string buyerId = 2;
  string agentId = 3;
  string propertyId = 4;
  string status = 5;
  string createdAt = 6;
  string updatedAt = 7;
  string lastMessageAt = 8;
}

message CreateOrGetConversationResponse {
  bool success = 1;
  ConversationResponse conversation = 2;
  string error = 3;
}

message SendChatMessageRequest {
  string conversationId = 1;
  string senderId = 2;
  string body = 3;
}

message ChatMessageResponse {
  string messageId = 1;
  string conversationId = 2;
  string senderId = 3;
  string recipientId = 4;
  string body = 5;
  string messageType = 6;
  string createdAt = 7;
  string readAt = 8;
}

message SendChatMessageResponse {
  bool success = 1;
  ChatMessageResponse message = 2;
  string error = 3;
}

message ListConversationsRequest {
  string userId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ConversationSummaryResponse {
  ConversationResponse conversation = 1;
  ChatMessageResponse lastMessage = 2;
  int32 unreadCount = 3;
}

message ListConversationsResponse {
  repeated ConversationSummaryResponse conversations = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ListConversationMessagesRequest {
  string conversationId = 1;
  string userId = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ListConversationMessagesResponse {
  repeated ChatMessageResponse messages = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message MarkConversationReadRequest {
  string conversationId = 1;
  string userId = 2;
}

message MarkConversationReadResponse {
  bool success = 1;
  int32 updatedCount = 2;
}

message Deal {
  string dealId = 1;
  string conversationId = 2;
  string propertyId = 3;
  string propertyTitle = 4;
  string buyerId = 5;
  string buyerName = 6;
  string agentId = 7;
  string agentName = 8;
  string status = 9;
  int64 quotedAmountMinor = 10;
  int64 platformFeeMinor = 11;
  string quoteNote = 12;
  string escrowId = 13;
  string createdAt = 14;
  string updatedAt = 15;
  string quotedAt = 16;
  string acceptedAt = 17;
  string source = 18;
}

message CreateOrGetDealRequest {
  string conversationId = 1;
  string userId = 2;
  string propertyTitle = 3;
  string source = 4;
}

message ListDealsRequest {
  string userId = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetDealRequest {
  string dealId = 1;
  string userId = 2;
}

message QuoteDealRequest {
  string dealId = 1;
  string agentId = 2;
  int64 amountMinor = 3;
  int64 platformFeeMinor = 4;
  string quoteNote = 5;
}

message AcceptDealQuoteRequest {
  string dealId = 1;
  string buyerId = 2;
  string idempotencyKey = 3;
}

message DealResponse {
  bool success = 1;
  Deal deal = 2;
  string error = 3;
}

message ListDealsResponse {
  repeated Deal deals = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message ListVerificationsRequest {
  int32 page = 1;
  int32 limit = 2;
}

message VerificationItem {
  string id = 1;
  string kind = 2;
  string status = 3;
  string title = 4;
  string detail = 5;
  string userId = 6;
  string email = 7;
  string createdAt = 8;
}

message ListVerificationsResponse {
  repeated VerificationItem verifications = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}
message GetAgentDealStatsRequest {
  string agentId = 1;
}

message DealMonthCount {
  string month = 1;
  int32 leads = 2;
}

message DealSourceCount {
  string source = 1;
  int32 count = 2;
}

message PropertyLeadCount {
  string propertyId = 1;
  int32 leads = 2;
}

message GetAgentDealStatsResponse {
  int32 leads = 1;
  int32 leadsLastMonth = 2;
  repeated DealMonthCount months = 3;
  repeated DealSourceCount sources = 4;
  repeated PropertyLeadCount propertyLeads = 5;
}
